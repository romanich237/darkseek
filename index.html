<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Darkseek</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>Darkseek</h1>
    </header>

    <section id="login">
      <h2>Вход</h2>
      <form id="login-form">
        <label for="key">Ключ доступа</label>
        <input id="key" value="V7Q9 N4RX 2K8M T6WP" autocomplete="off" required>
        <button type="submit">Войти</button>
        <p id="login-status" role="status"></p>
      </form>
    </section>

    <section id="chat" hidden>
      <header class="chat-header">
        <h2>Диалог с ghost_7a2f</h2>
        <button id="logout" type="button">Выйти</button>
      </header>

      <div id="messages" role="log" aria-label="Сообщения">
        <p id="empty">Сообщений пока нет.</p>
      </div>

      <form id="composer">
        <label for="message">Сообщение</label>
        <div class="composer-row">
          <input id="message" maxlength="500" autocomplete="off" required>
          <button type="submit">Отправить</button>
        </div>
      </form>
    </section>
  </main>

  <script>
    const login = document.getElementById('login');
    const chat = document.getElementById('chat');
    const key = document.getElementById('key');
    const loginStatus = document.getElementById('login-status');
    const message = document.getElementById('message');
    const messages = document.getElementById('messages');

    document.getElementById('login-form').addEventListener('submit', event => {
      event.preventDefault();
      const value = key.value.replace(/\s/g, '').toUpperCase();

      if (value !== 'V7Q9N4RX2K8MT6WP') {
        loginStatus.textContent = 'Демо-ключ: V7Q9 N4RX 2K8M T6WP';
        key.focus();
        return;
      }

      loginStatus.textContent = '';
      login.hidden = true;
      chat.hidden = false;
      message.focus();
    });

    document.getElementById('logout').addEventListener('click', () => {
      chat.hidden = true;
      login.hidden = false;
      key.focus();
    });

    document.getElementById('composer').addEventListener('submit', event => {
      event.preventDefault();
      const text = message.value.trim();

      if (!text) return;

      document.getElementById('empty')?.remove();

      const item = document.createElement('p');
      item.className = 'message';
      item.textContent = 'Вы: ' + text;
      messages.append(item);
      messages.scrollTop = messages.scrollHeight;

      message.value = '';
      message.focus();
    });
  </script>
</body>
</html>
